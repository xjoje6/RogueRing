[package]
name = "pantalla"
version = "0.1.0"
edition = "2024"
description = "Crea un monitor virtual con el driver de Parsec (VDD) y lo mantiene vivo mientras corre."

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
]
