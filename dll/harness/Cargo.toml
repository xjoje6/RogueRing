[package]
name = "rogue-harness"
version = "0.1.0"
edition = "2024"
description = "RogueRing: la DLL del mod (director de la run, interfaz y efectos dentro del juego)."

[lib]
crate-type = ["cdylib"]

# La versión para jugadores se compila sin el banco de pruebas (`--no-default-features`).
[features]
default = ["banco"]
# Banco de pruebas: órdenes por archivo, mando virtual, foco, ventana, teclado y ratón simulados.
banco = []

[dependencies]
# Versión de git (vendor): la publicada no soporta ER 2.7.1.
eldenring = { path = "../../tools/vendor/fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../../tools/vendor/fromsoftware-rs/crates/shared" }
serde_json = "1"
serde = "1"
rogue-core = { path = "../core" }
rogue-ui = { path = "../ui" }
hudhook = { version = "0.9", default-features = false, features = ["dx12"] }
image = { version = "0.25", default-features = false, features = ["png"] }
retour = "0.3"
pelite = "0.10"
# MD5 de los bloques del guardado (partida plantilla, src/plantilla.rs).
md5 = { package = "md-5", version = "0.10" }

[dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Memory", "Win32_System_Diagnostics_Debug"]
